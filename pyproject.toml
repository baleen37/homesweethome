[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "homesweethome"
version = "0.1.0"
description = "Python web crawler boilerplate with CSV export"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.8",
    "mypy>=1.19.0",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "psutil>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "src:."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: Integration tests that call real APIs (slow)",
    "slow: Slow tests (e.g., rate limiting tests)",
]

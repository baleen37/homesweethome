repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-beautifulsoup4, types-setuptools, types-psutil, python-dotenv, structlog, playwright, pytest, pydantic]
        args: [--config-file=pyproject.toml]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -v
        language: system
        pass_filenames: false
        always_run: true

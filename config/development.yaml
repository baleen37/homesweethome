# 개발 환경 설정
# 개발 환경에서는 속도보다 디버깅과 테스트 용이성에 초점을 맞춘 설정

# 기본 설정
base_url: "https://hogangnono.com"  # API 기본 URL
timeout: 60  # HTTP 요청 타임아웃 (초)
headless: false  # 개발에서는 브라우저를 보여줌 (디버깅 용이)
output_file: null  # 자동으로 파일명 생성

# Rate Limiting 설정
# API 서버 부하를 방지하기 위한 요청 간격 조절
rate_limit_delay: 1.0  # 기본 API 호출 간격 (초)
rate_limit_min: 0.1  # 최소 딜레이 (초)
rate_limit_max: 5.0  # 최대 딜레이 (초)
rate_limit_increment: 0.5  # 429 에러 시 딜레이 증가량 (초)
rate_limit_decrement_after: 5  # 성공 시 딜레이 감소까지 필요한 성공 횟수
daily_request_limit: 5000  # 일일 최대 요청 수

# 페이징 설정
# API 응답 페이지 관련 설정
page_size: 20  # 한 페이지당 아이템 수 (개발에서는 작은 사이즈)
max_page: 50  # 최대 페이지 수

# 재시도 설정
# 일시적 오류 발생 시 재시도 관련 설정
retry_attempts: 2  # 최대 재시도 횟수
retry_delay: 0.5  # 재시도 간격 (초)

# 쓰레딩 설정
# 병렬 처리 관련 설정
use_threading: true  # 쓰레딩 사용 여부
max_workers: 2  # 동시 worker 수 (개발에서는 적게 설정)

# 지역 설정
# 크롤링 대상 지역 필터링
region_code: null  # 특정 지역 코드 (null: 전체)
start_date: null  # 시작일 (YYYYMM 형식)
end_date: null  # 종료일 (YYYYMM 형식)

# 필터링 기본값
# 기본 검색 필터 설정
default_property_type: "apartment"  # 기본 부동산 종류
default_transaction_type: "sale"  # 기본 거래 종류

# 출력 디렉토리
output_dir: "output_dev"  # 결과물 저장 디렉토리

# 로그 레벨
log_level: "DEBUG"  # 개발에서는 상세한 로그 출력

# 지역 경계 (서울 일부)
# bbox 형식: [min_lat, min_lon, max_lat, max_lon]
region_bounds: [37.483294, 126.934086, 37.585133, 127.083394]  # 강남/서초/송파 일부
